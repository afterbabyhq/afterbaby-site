body::before{
  content:""; position:fixed; inset:0; z-index:-1;
  background-image:linear-gradient(var(--veil-a), var(--veil-b)), var(--monet);
  background-size:cover; background-position:center 30%;
  transition:background .4s;
}
.archframe{
  display:inline-block; overflow:hidden; border-radius:150px 150px 22px 22px;
  border:1px solid rgba(156,132,85,.55); padding:0; box-shadow:var(--shadow);
}
.archframe img{display:block; width:100%; height:100%; object-fit:cover;}
.facecircle{
  width:72px; height:72px; border-radius:50%; object-fit:cover;
  border:1px solid rgba(156,132,85,.55); box-shadow:var(--shadow);
}
.artcredit{font-size:.66rem; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); font-weight:400;}
.app{max-width:520px; margin:0 auto; padding:0 22px 116px; min-height:100vh;}
/* ---------- type ---------- */
h1,h2,h3{font-family:'Fraunces',serif; font-weight:400; letter-spacing:-.01em;}
h1{font-size:1.85rem; line-height:1.2;}
h2{font-size:1.3rem; margin-bottom:4px;}
h3{font-size:1.08rem;}
.sub{color:var(--muted); font-size:.95rem; font-weight:300;}
.tiny{font-size:.8rem; color:var(--faint); font-weight:300;}
.src{display:block; margin-top:6px; font-size:.72rem; color:var(--faint); font-weight:400; letter-spacing:.02em;}
.src a{color:var(--pine); text-decoration:underline; text-underline-offset:3px; text-decoration-thickness:1px; font-weight:500;}
.srclist .li a{display:block;}
.srclist .li .tiny{display:block; margin-top:2px; word-break:break-all;}
.lbl{
  display:block; text-transform:uppercase; letter-spacing:.16em;
  font-size:.66rem; font-weight:500; color:var(--faint); margin-bottom:10px;
}
.serifita{font-family:'Fraunces',serif; font-style:italic; font-weight:300;}
/* ---------- wordmark & mascot ---------- */
.wordmark{font-family:'Fraunces',serif; font-weight:500; font-size:1.35rem; letter-spacing:.01em; display:inline-flex; align-items:center; gap:10px;}
.mascot-hero{display:flex; justify-content:center; margin-bottom:16px;}
/* ---------- header ---------- */
header.top{display:flex; align-items:center; justify-content:space-between; padding:26px 2px 10px;}
.iconbtn{
  background:transparent; border:1px solid var(--line); color:var(--muted);
  width:46px; height:46px; border-radius:50%;
  display:flex; align-items:center; justify-content:center; cursor:pointer;
}
.iconbtn svg{width:19px; height:19px;}
.iconbtn:active{transform:scale(.96);}
/* ---------- cards ---------- */
.card{
  background:var(--card); border:1px solid var(--line); border-radius:var(--r);
  padding:26px 24px; margin:16px 0; box-shadow:var(--shadow);
  -webkit-backdrop-filter:blur(18px) saturate(1.15); backdrop-filter:blur(18px) saturate(1.15);
}
.card.quiet{background:var(--mist);}
.hr{height:1px; background:var(--line); margin:18px 0; border:none;}
/* ---------- buttons ---------- */
.btn{
  display:block; width:100%; border:none; cursor:pointer; text-align:center;
  font-family:'Jost',sans-serif; font-weight:500; font-size:1rem; letter-spacing:.04em;
  padding:17px 22px; border-radius:999px; min-height:56px;
  background:var(--pine); color:#FDFDFC; transition:transform .08s, opacity .2s;
}
[data-theme="dark"] .btn{color:#0E1F1A;}
.btn:active{transform:scale(.985);}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink); font-weight:400;}
.btn.blueb{background:var(--blue); color:#FDFDFC;}
[data-theme="dark"] .btn.blueb{color:#0D1B26;}
.btn.alert{background:var(--alert); color:#FDFDFC;}
[data-theme="dark"] .btn.alert{color:#2A1218;}
.btn+.btn{margin-top:12px;}
.btn:focus-visible,.iconbtn:focus-visible,.opt:focus-visible,.tab:focus-visible{outline:2px solid var(--blue); outline-offset:3px;}
/* ---------- nav ---------- */
nav.tabs{
  position:fixed; bottom:0; left:0; right:0; z-index:50;
  background:var(--card); border-top:1px solid var(--line);
  -webkit-backdrop-filter:blur(22px) saturate(1.15); backdrop-filter:blur(22px) saturate(1.15);
  display:flex; justify-content:space-around; padding:10px 8px calc(12px + env(safe-area-inset-bottom));
}
.tab{
  background:none; border:none; cursor:pointer; font-family:inherit;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  color:var(--faint); font-size:.64rem; font-weight:500; letter-spacing:.12em; text-transform:uppercase;
  min-width:58px; min-height:54px; padding:7px 4px; border-radius:16px;
}
.tab svg{width:21px; height:21px;}
.tab.active{color:var(--pine);}
[data-theme="dark"] .tab.active{color:var(--pine);}

/* ---------- somewhere quiet ---------- */
.qs{position:fixed;inset:0;z-index:200;overflow:hidden;background:#CFE0DA;font-family:'Jost',system-ui,sans-serif;}
.qs .qpond{position:absolute;inset:-8%;width:116%;height:116%;background:var(--monet) center/cover no-repeat;animation:qdrift 90s ease-in-out infinite alternate;filter:saturate(.92) brightness(1.02);}
@keyframes qdrift{0%{transform:translate(0,0) scale(1)}50%{transform:translate(-1.8%,1.2%) scale(1.05)}100%{transform:translate(1.4%,-1.6%) scale(1.08)}}
.qs .qveil{position:absolute;inset:0;background:linear-gradient(180deg,rgba(247,250,247,.42) 0%,rgba(247,250,247,.10) 40%,rgba(247,250,247,.06) 70%,rgba(247,250,247,.32) 100%)}
.qs.night .qveil{background:linear-gradient(180deg,rgba(14,26,34,.62) 0%,rgba(14,26,34,.34) 45%,rgba(14,26,34,.30) 70%,rgba(14,26,34,.62) 100%)}
.qs.night .qpond{filter:saturate(.7) brightness(.62) hue-rotate(-8deg)}
.qs .qlight{position:absolute;inset:-20%;background:radial-gradient(ellipse at 30% 20%,rgba(255,250,235,.55),transparent 55%);mix-blend-mode:soft-light;animation:qsun 40s ease-in-out infinite alternate}
.qs.night .qlight{background:radial-gradient(ellipse at 70% 12%,rgba(220,232,255,.45),transparent 50%)}
@keyframes qsun{from{transform:translate(0,0);opacity:.7}to{transform:translate(8%,6%);opacity:1}}
.qs .qshim{position:absolute;inset:0;background:repeating-linear-gradient(115deg,transparent 0 38px,rgba(255,255,255,.045) 38px 60px);background-size:300% 300%;animation:qshim 28s linear infinite;mix-blend-mode:screen;opacity:.8}
@keyframes qshim{from{background-position:0 0}to{background-position:100% 60%}}
.qs canvas{position:absolute;inset:0;width:100%;height:100%}
.qs .qwords{position:absolute;left:0;right:0;top:44%;text-align:center;padding:0 10%;pointer-events:none}
.qs .qwords p{font-family:'Fraunces',serif;font-weight:300;font-size:clamp(1.45rem,4.6vw,2.3rem);line-height:1.35;color:var(--pine-deep,#24564A);opacity:0;transition:opacity 3.5s ease;text-shadow:0 1px 18px rgba(247,250,247,.9)}
.qs.night .qwords p{color:#E6EEF2;text-shadow:0 1px 18px rgba(0,0,0,.5)}
.qs .qwords p.on{opacity:.92}
.qs .qtop{position:absolute;top:calc(14px + env(safe-area-inset-top));left:0;right:0;display:flex;justify-content:space-between;align-items:center;padding:0 18px;transition:opacity 1.2s}
.qs .qbottom{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:10px;flex-wrap:wrap;padding:0 16px;transition:opacity 1.2s}
.qs.uihide .qtop,.qs.uihide .qbottom{opacity:0;pointer-events:none}
.qs .qchip{border:1px solid rgba(36,86,74,.28);background:rgba(247,250,247,.62);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:#24564A;font:500 .8rem 'Jost',sans-serif;letter-spacing:.06em;text-transform:uppercase;padding:12px 16px;border-radius:999px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center}
.qs .qchip.on{background:rgba(36,86,74,.92);color:#F7FAF7;border-color:transparent}
.qs.night .qchip{background:rgba(20,34,40,.55);color:#E6EEF2;border-color:rgba(230,238,242,.25)}
.qs .qback{background:none;border:none;color:#24564A;font:400 .95rem 'Jost',sans-serif;padding:10px 6px;min-height:44px;cursor:pointer;text-shadow:0 1px 12px rgba(247,250,247,.9)}
.qs .qlbl{font:500 .68rem 'Jost',sans-serif;letter-spacing:.18em;text-transform:uppercase;color:#5E7A70;text-shadow:0 1px 12px rgba(247,250,247,.9)}
.qs.night .qback,.qs.night .qlbl{color:#E6EEF2;text-shadow:0 1px 12px rgba(0,0,0,.6)}
.qs .qlily{position:absolute;left:50%;top:50%;width:min(56vw,300px);height:min(56vw,300px);transform:translate(-50%,-56%);display:none;pointer-events:none}
.qs .qlily.on{display:block}
.qs .qlily svg{width:100%;height:100%;overflow:visible}
.qs .qlily .qpet{transform-origin:150px 168px;animation:qbreathe 12s ease-in-out infinite}
@keyframes qbreathe{0%{transform:scale(.62)}33%{transform:scale(1)}50%{transform:scale(1)}100%{transform:scale(.62)}}
.qs .qlily .qcue{font-family:'Fraunces',serif;font-size:15px;fill:#24564A;opacity:.85}
.qs.night .qlily .qcue{fill:#E6EEF2}.qs.night .qlily path{stroke:#E6EEF2}
.qs .qread{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:8vh 8vw;overflow:auto;-webkit-overflow-scrolling:touch}
.qs .qread.on{display:flex}
.qs .qread .qpg{max-width:560px;background:rgba(247,250,247,.78);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border-radius:28px;padding:34px 30px;box-shadow:0 20px 60px rgba(36,64,60,.12)}
.qs .qread h2{font-family:'Fraunces',serif;font-weight:400;color:#24564A;font-size:1.5rem;margin:0 0 14px}
.qs .qread p{font-family:'Fraunces',serif;font-weight:300;color:#2C4A43;font-size:1.12rem;line-height:1.75;margin:0 0 14px}
.qs .qread .qnx{margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
.qs .qhint{position:absolute;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));text-align:center;color:#5E7A70;font-size:.78rem;letter-spacing:.04em;opacity:.8;pointer-events:none;transition:opacity 2s}
.qs.night .qhint{color:#C9D6DC}
.jr{width:100%;min-height:120px;}
.jr-entry{padding:13px 0;border-bottom:1px solid var(--line);font-weight:300;font-size:.95rem;white-space:pre-wrap;}
.jr-entry .tiny{display:block;margin-bottom:4px;}
@media (prefers-reduced-motion: reduce){.qs .qpond,.qs .qlight,.qs .qshim,.qs .qlily .qpet{animation:none}}
/* ---------- forms ---------- */
label.f{display:block; font-weight:500; font-size:.9rem; margin:18px 0 9px; letter-spacing:.02em;}
input[type=text],input[type=date],input[type=number],textarea{
  width:100%; padding:15px 18px; border-radius:var(--r-sm); border:1px solid var(--line);
  background:var(--card); color:var(--ink); font-family:inherit; font-size:1rem; min-height:52px; font-weight:300;
}
textarea{resize:vertical; min-height:84px;}
input:focus,textarea:focus{outline:none; border-color:var(--pine);}
.optrow{display:flex; gap:9px; flex-wrap:wrap;}
.opt{
  flex:1 1 auto; min-height:52px; padding:12px 14px; cursor:pointer; text-align:center;
  border:1px solid var(--line); border-radius:999px; background:var(--card);
  font-family:inherit; font-size:.92rem; font-weight:400; color:var(--muted); letter-spacing:.02em;
}
.opt.sel{border-color:var(--pine); background:var(--pine-soft); color:var(--pine-deep); font-weight:500;}
[data-theme="dark"] .opt.sel{color:var(--pine-deep);}
/* ---------- lists ---------- */
.li{padding:13px 0; border-bottom:1px solid var(--line); font-weight:300; font-size:.95rem;}
.li:last-child{border-bottom:none;}
.li b{font-weight:500;}
/* ---------- bars ---------- */
.bars{display:flex; align-items:flex-end; gap:5px; height:60px; margin-top:12px;}
.bars .b{flex:1; background:var(--pine); opacity:.85; border-radius:4px 4px 2px 2px; min-height:5px;}
.bars .b.bluefill{background:var(--blue);}
.bars .b.empty{background:var(--line); min-height:4px; opacity:1;}
.barlabels{display:flex; justify-content:space-between; margin-top:6px;}
/* ---------- snack ---------- */
#snack{
  position:fixed; bottom:104px; left:50%; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:var(--bg); padding:13px 22px; border-radius:999px;
  font-weight:400; font-size:.9rem; letter-spacing:.02em; opacity:0; pointer-events:none; transition:all .3s;
  display:flex; gap:16px; align-items:center; z-index:99; max-width:90vw;
}
#snack.show{opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto;}
#snack button{background:none; border:none; color:var(--sand); font-weight:500; font-size:.9rem; cursor:pointer; font-family:inherit; min-height:44px; letter-spacing:.06em;}
/* ---------- modal ---------- */
.modal-bg{position:fixed; inset:0; background:rgba(16,27,24,.5); z-index:80; display:flex; align-items:flex-end; justify-content:center;}
.modal{
  background:var(--bg); border-radius:30px 30px 0 0; padding:30px 24px calc(28px + env(safe-area-inset-bottom));
  width:100%; max-width:520px; max-height:88vh; overflow-y:auto;
}
/* ---------- misc ---------- */
.row{display:flex; gap:10px;}
.row>*{flex:1;}
.center{text-align:center;}
.spacer{height:10px;}
.pill-emergency{
  display:block; width:100%; background:transparent;
  border:1px solid var(--alert); color:var(--alert);
  border-radius:999px; padding:15px 18px; font-weight:500; font-size:.9rem; letter-spacing:.04em;
  cursor:pointer; font-family:inherit; text-align:center; min-height:52px; margin:16px 0;
}
.footer-note{margin:30px 6px 8px; text-align:center; font-size:.76rem; color:var(--faint); line-height:1.7; font-weight:300;}
.affirm{font-family:'Fraunces',serif; font-style:italic; font-weight:300; font-size:1.25rem; line-height:1.45; color:var(--ink); padding:8px 2px;}
.stat{text-align:center; padding:12px 4px;}
.stat .n{font-family:'Fraunces',serif; font-size:1.35rem; font-weight:400;}
.stat .l{font-size:.62rem; color:var(--faint); font-weight:500; letter-spacing:.14em; text-transform:uppercase; margin-top:2px;}
.progressdots{display:flex; gap:7px; justify-content:center; margin:18px 0;}
.progressdots .d{width:7px; height:7px; border-radius:99px; background:var(--line);}
.progressdots .d.on{background:var(--pine); width:24px;}
.tag{display:inline-block; font-size:.62rem; font-weight:500; letter-spacing:.14em; text-transform:uppercase; color:var(--blue); padding:4px 0;}
.crisis-strip{background:var(--blue-soft); border-radius:var(--r-sm); padding:14px 16px; font-size:.88rem; color:var(--muted); margin-top:14px; font-weight:300;}
.crisis-strip b{color:var(--ink); font-weight:500;}
a{color:var(--pine); font-weight:500; text-decoration:none;}
[data-theme="dark"] a{color:var(--pine);}
@media (prefers-reduced-motion: reduce){ *{transition:none !important; animation:none !important;} }
@media print{
  nav.tabs,header.top,.no-print,#snack{display:none !important;}
  body{background:#fff; color:#111;}
  .card{box-shadow:none; border:1px solid #ccc; break-inside:avoid;}
  .app{padding-bottom:0; max-width:100%;}
}
</style>
</head>
<body>
<div class="app" id="app" role="main"></div>
<nav class="tabs no-print" id="tabs" role="navigation" aria-label="Main navigation" style="display:none"></nav>
<div id="snack" role="status"></div>
<div id="modalroot"></div>
<div id="quietroot"></div>

<script>
"use strict";
/* ================= storage ================= */
var MEM = {};
function sget(k){ try{ var v = localStorage.getItem(k); return v===null? (MEM[k]!==undefined?MEM[k]:null) : v; }catch(e){ return MEM[k]!==undefined?MEM[k]:null; } }
function sset(k,v){ MEM[k]=v; try{ localStorage.setItem(k,v); }catch(e){} }
function sdel(k){ delete MEM[k]; try{ localStorage.removeItem(k); }catch(e){} }
function jget(k,fb){ var v=sget(k); if(v===null) return fb; try{ return JSON.parse(v); }catch(e){ return fb; } }
function jset(k,o){ sset(k, JSON.stringify(o)); }

/* ================= state ================= */
var S = {
  profile: jget('ab.profile', null),
  logs: jget('ab.logs', []),
  epds: jget('ab.epds', []),
  concerns: jget('ab.concerns', []),
  village: jget('ab.village', null),
  journal: jget('ab.journal', []),
  view: 'today',
  lastDeleted: null
};
function persist(){ jset('ab.profile',S.profile); jset('ab.logs',S.logs); jset('ab.epds',S.epds); jset('ab.concerns',S.concerns); jset('ab.village',S.village); jset('ab.journal',S.journal); }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayKey(d){ var x=d||new Date(); return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0'); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ================= icons (inline SVG, stroke) ================= */
function icon(name, size){
  var s=size||21;
  var paths={
    sun:'<circle cx="12" cy="12" r="4.4"/><path d="M12 2.5v2.4M12 19.1v2.4M2.5 12h2.4M19.1 12h2.4M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>',
    leaf:'<path d="M5 19C5 10 10 4.5 19.5 4.5c0 9.5-5.5 14.5-14.5 14.5Z"/><path d="M5 19c3-6 7-9.5 11-11.5"/>',
    moon:'<path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>',
    sheet:'<rect x="5" y="3.5" width="14" height="17" rx="2.5"/><path d="M9 9h6M9 13h6M9 17h3.5"/>',
    people:'<circle cx="9" cy="8.5" r="3"/><path d="M3.5 19c.7-3.3 2.9-5 5.5-5s4.8 1.7 5.5 5"/><circle cx="16.5" cy="9.5" r="2.4"/><path d="M15.5 14.2c2.4.3 4.3 1.9 5 4.8"/>',
    theme:'<circle cx="12" cy="12" r="8.5"/><path d="M12 3.5v17A8.5 8.5 0 0 0 12 3.5Z" fill="currentColor" stroke="none"/>',
    gear:'<path d="M4 8h10M18 8h2M4 16h4M12 16h8"/><circle cx="15.5" cy="8" r="2.2"/><circle cx="9.5" cy="16" r="2.2"/>'
  };
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+paths[name]+'</svg>';
}
/* ================= emblem: the water lily ================= */
function lily(size){
  var s=size||30;
  return '<svg width="'+s+'" height="'+s+'" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="AfterBaby water lily" style="color:var(--pine);flex:0 0 auto">'+
  '<path d="M32 40 C29 30 29 20 32 12 C35 20 35 30 32 40 Z"/>'+
  '<path d="M32 40 C26 34 22 26 21 17 C28 22 31 30 32 40 Z"/>'+
  '<path d="M32 40 C38 34 42 26 43 17 C36 22 33 30 32 40 Z"/>'+
  '<path d="M32 40 C24 38 17 34 13 27 C22 30 28 34 32 40 Z"/>'+
  '<path d="M32 40 C40 38 47 34 51 27 C42 30 36 34 32 40 Z"/>'+
  '<path d="M15 46 C20 51 44 51 49 46"/>'+
  '<path d="M8 53 C13 55 19 55 24 53 M40 53 C45 55 51 55 56 53"/>'+
  '</svg>';
}
function puffin(size){ return lily(size); }
function puffinHero(){ return lily(88); }
function wordmark(fontRem, iconPx){
  return '<span class="wordmark" style="font-size:'+(fontRem||1.35)+'rem">'+lily(iconPx||26)+'AfterBaby</span>';
}
/* ================= theme ================= */
function applyTheme(){
  var pref = sget('ab.theme') || 'auto';
  var dark = pref==='dark' || (pref==='auto' && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
  document.documentElement.setAttribute('data-theme', dark?'dark':'light');
  var meta=document.querySelector('meta[name=theme-color]'); if(meta) meta.setAttribute('content', dark?'#0D1715':'#F7FAF7');
}
applyTheme();
if(window.matchMedia){ try{ window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme); }catch(e){} }

/* ================= postpartum math & content ================= */
function ppDays(){ if(!S.profile||!S.profile.birthDate) return 0; var b=new Date(S.profile.birthDate+'T12:00:00'); return Math.max(0, Math.floor((Date.now()-b.getTime())/86400000)); }
function ppWeeks(){ return Math.floor(ppDays()/7); }
function ppLabel(){ var d=ppDays(), w=Math.floor(d/7), r=d%7;
  if(d<7) return 'Day '+(d+1);
  if(w<13) return 'Week '+w+(r? ' · day '+r:'');
  var m=Math.floor(d/30.4); return 'Month '+m;
}
var AFFIRM = [
  "Rest is part of the work.",
  "Healing keeps its own calendar.",
  "You are allowed to be new at this.",
  "Some days, enough is everything.",
  "Your body is doing quiet, serious work.",
  "You can miss who you were and love who you are becoming.",
  "Being cared for is not a luxury.",
  "Slow is a pace."
];
/* ================= sources & citations ================= */
var SOURCES = {
  acog736:  ["ACOG", "ACOG Committee Opinion 736 — Optimizing Postpartum Care (2018)", "https://www.acog.org/clinical/clinical-guidance/committee-opinion/articles/2018/05/optimizing-postpartum-care"],
  acogppd:  ["ACOG", "ACOG — Postpartum Depression (patient FAQ)", "https://www.acog.org/womens-health/faqs/postpartum-depression"],
  acogex:   ["ACOG", "ACOG — Exercise After Pregnancy (patient FAQ)", "https://www.acog.org/womens-health/faqs/exercise-after-pregnancy"],
  acogui:   ["ACOG", "ACOG — Urinary Incontinence (patient FAQ)", "https://www.acog.org/womens-health/faqs/urinary-incontinence"],
  cdchear:  ["CDC", "CDC Hear Her — Urgent Maternal Warning Signs", "https://www.cdc.gov/hearher/maternal-warning-signs/index.html"],
  cdcsleep: ["CDC", "CDC — About Sleep: how much sleep adults need", "https://www.cdc.gov/sleep/about/index.html"],
  nimh:     ["NIMH", "National Institute of Mental Health — Perinatal Depression", "https://www.nimh.nih.gov/health/publications/perinatal-depression"],
  ccloch:   ["Cleveland Clinic", "Cleveland Clinic — Lochia (Postpartum Bleeding): stages, duration, warning signs", "https://my.clevelandclinic.org/health/symptoms/22485-lochia"],
  sfsweat:  ["Sleep Foundation", "Sleep Foundation — Postpartum Night Sweats", "https://www.sleepfoundation.org/pregnancy/postpartum-night-sweats"],
  nhsbody:  ["NHS", "NHS — Your body after the birth", "https://www.nhs.uk/pregnancy/labour-and-birth/after-the-birth/your-body/"],
  aad:      ["AAD", "American Academy of Dermatology — Hair loss in new moms", "https://www.aad.org/public/diseases/hair-loss/insider/new-moms"],
  epds:     ["Cox et al. 1987", "Cox JL, Holden JM, Sagovsky R. Detection of postnatal depression: development of the 10-item Edinburgh Postnatal Depression Scale. British Journal of Psychiatry 1987;150:782–786", "https://doi.org/10.1192/bjp.150.6.782"],
  psi:      ["PSI", "Postpartum Support International — Get Help (HelpLine 1-800-944-4773)", "https://www.postpartum.net/get-help/"],
  psidep:   ["PSI", "Postpartum Support International — Depression during pregnancy and postpartum", "https://www.postpartum.net/learn-more/depression/"],
  psiocd:   ["PSI", "Postpartum Support International — Intrusive thoughts and obsessive symptoms", "https://www.postpartum.net/learn-more/obsessive-symptoms/"],
  lifeline: ["988 Lifeline", "988 Suicide and Crisis Lifeline", "https://988lifeline.org/"],
  sacks:    ["Sacks, TED", "Sacks A. A new way to think about the transition to motherhood (TED, 2018)", "https://www.ted.com/talks/alexandra_sacks_a_new_way_to_think_about_the_transition_to_motherhood"],
  support:  ["BMC Psychology 2024", "Khademi K, Kaveh MH. Social support as a coping resource for psychosocial conditions in the postpartum period: a systematic review. BMC Psychology 2024", "https://pmc.ncbi.nlm.nih.gov/articles/PMC11131291/"],
  who:      ["WHO", "World Health Organization — Recommendations on maternal and newborn care for a positive postnatal experience (2022)", "https://www.who.int/publications/i/item/9789240045989"],
  medline:  ["MedlinePlus", "MedlinePlus (NIH) — Postpartum Care", "https://medlineplus.gov/postpartumcare.html"],
  owh:      ["Office on Women's Health", "U.S. Office on Women's Health — Recovering from birth", "https://www.womenshealth.gov/pregnancy/childbirth-and-beyond/recovering-birth"]
};
function srclink(k){ var x=SOURCES[k]; return '<a href="'+x[2]+'" target="_blank" rel="noopener" aria-label="Source: '+esc(x[1])+'">'+esc(x[0])+'</a>'; }
function cite(keys){ return '<span class="src">Source: '+keys.map(srclink).join(' · ')+'</span>'; }
function li(text, keys){ return '<div class="li">'+text+cite(keys)+'</div>'; }
function sourcesModal(){
  var order=['acog736','acogppd','acogex','acogui','cdchear','cdcsleep','nimh','psi','psidep','psiocd','lifeline','epds','ccloch','sfsweat','nhsbody','aad','support','sacks','who','medline','owh'];
  var h='<h2>Sources and references</h2>'+
  '<p class="sub" style="margin:8px 0 14px">Every piece of health information in AfterBaby is drawn from the sources below, and each statement in the app links to its source. AfterBaby offers general information for your own awareness; it is not medical advice, and it never replaces your doctor, midwife, nurse, or therapist.</p>'+
  '<div class="card srclist">'+order.map(function(k){ var x=SOURCES[k]; return '<div class="li"><a href="'+x[2]+'" target="_blank" rel="noopener">'+esc(x[1])+'</a><span class="tiny">'+esc(x[2])+'</span></div>'; }).join('')+'</div>'+
  '<p class="tiny" style="margin-top:12px">Links open in your browser. Sources were reviewed for this release; if you find something out of date, write to hello@afterbaby.health.</p>'+
  '<button class="btn ghost" data-act="modal-close">Close</button>';
  openModal(h);
}
function weekGuide(){
  var w = ppWeeks();
  if(w<1) return {title:"The first week", items:[
    ["Bleeding is heaviest now. Soaking a pad in an hour is never normal; call your provider.", ["ccloch","cdchear"]],
    ["Weepiness peaking around day three touches most mothers. It should soften within two weeks.", ["acogppd","nimh"]],
    ["Your only work: feed, rest, heal. The rest can belong to someone else.", ["acog736","nhsbody"]]
  ]};
  if(w<2) return {title:"Week one to two", items:[
    ["Bleeding should be lightening to pink or brown. A sudden return of bright red usually means you are doing too much.", ["ccloch","nhsbody"]],
    ["Night sweats are hormones leaving. Keep water close.", ["sfsweat","nhsbody"]],
    ["If the heaviness of the early days is not lifting, that is a signal, not a failure. The Mind page is there.", ["nimh","acogppd"]]
  ]};
  if(w<5) return {title:"Weeks two to four", items:[
    ["Bleeding tapers to brown, then to little. Up to six weeks is within normal.", ["ccloch"]],
    ["This tiredness is structural. Track your sleep and let it be seen by the people who can help.", ["cdcsleep","cdchear"]],
    ["Mood changes most often surface in these weeks. A quiet five-minute check-in is real care.", ["nimh","acogppd"]]
  ]};

  '<p class="sub" style="margin:6px 0 0">AfterBaby is built by one mom and stays free for the parts that matter most. If it has helped you, you can help it grow: a one-time '+esc(FM.price)+' unlocks everything we ever add, forever, and puts your name on the page that made it possible. No subscription. No pressure. It will always be okay to keep using AfterBaby for free.</p>'+
  '<div class="spacer"></div>'+
  (native? '<button class="btn" data-act="fm-buy">Become a Founding Mother — '+esc(FM.price)+'</button><button class="btn ghost" data-act="fm-restore">Restore purchase</button>'
         : '<p class="tiny">Available in the AfterBaby app for iPhone.</p>')+
  (where==='mind'? '<button class="btn ghost" data-act="fm-later" style="border:none;color:var(--faint)">Not now</button>':'')+
  '<p class="tiny" style="margin-top:10px">Offered during our first season only. Everything free today stays free.</p></div>';
}
function fmShowOnMind(){ if(fmState()) return false; var last=sget('ab.fm_dismissed'); if(!last) return S.logs.length>=3; return (Date.now()-Number(last))>14*86400000; }
function fmBusy(btn,on){ if(!btn) return; btn.disabled=on; btn.style.opacity=on?'.6':''; }
function fmGrant(tx){ var cur=fmState()||{}; fmSet({tx:(tx&&tx.transactionId)||cur.tx||'', date:cur.date||todayKey(), name:cur.name||''}); }
function fmBuy(btn, restoring){ var p=fmPlugin(); if(!p){ snack('Purchases live in the AfterBaby app for iPhone.'); return; } fmBusy(btn,true);
  p.purchaseProduct({productIdentifier:FM_PRODUCT}).then(function(tx){ fmGrant(tx); fmBusy(btn,false); closeModal(); render(); if(restoring) snack('Welcome back, Founding Mother.'); else fmThanks(); })
  .catch(function(e){ fmBusy(btn,false); var m=String((e&&e.message)||e||''); if(/cancel/i.test(m)) snack(restoring?'No purchase was restored.':'No problem. It will always be okay to keep going for free.'); else if(/pending|ask to buy/i.test(m)) snack('Your purchase is waiting for approval. Nothing has been charged yet.'); else snack('Apple could not complete that just now. Nothing was charged.'); }); }
function fmThanks(){ openModal('<div class="center" style="padding:16px 0"><div style="font-size:42px;line-height:1">♥</div><h2>Thank you'+(S.profile.name?', '+esc(S.profile.name):'')+'.</h2>'+
  '<p class="sub">You are a Founding Mother. Everything AfterBaby ever adds is yours, always — and you just helped the next tired mom find this for free.</p>'+
  '<div class="spacer"></div><button class="btn" data-act="modal-close">Back to it</button></div>'); }
/* ================= settings modal ================= */
function settingsModal(){
  var theme=sget('ab.theme')||'auto';
  var h='<h2>Settings</h2>'+
  '<div class="card"><span class="lbl">You</span>'+
  '<label class="f" for="set-name">Name</label><input type="text" id="set-name" value="'+esc(S.profile.name)+'">'+
  '<label class="f" for="set-date">Birth date</label><input type="date" id="set-date" value="'+esc(S.profile.birthDate)+'" max="'+todayKey()+'">'+
  '<div class="spacer"></div><button class="btn ghost" data-act="set-save">Save changes</button></div>'+
  '<div class="card"><span class="lbl">Appearance</span><div class="optrow" id="themerow">'+
  [['auto','Automatic'],['light','Light'],['dark','Dark']].map(function(t){return '<button class="opt'+(theme===t[0]?' sel':'')+'" data-theme-v="'+t[0]+'">'+t[1]+'</button>';}).join('')+
  '</div></div>'+
  '<div class="card"><span class="lbl">Your data, your rules</span>'+
  '<p class="tiny" style="margin:6px 0 12px">Everything lives on this device only. No account, no cloud, nothing sold. Ever.</p>'+
  '<button class="btn ghost" data-act="export">Export my data</button>'+
  '<button class="btn ghost" data-act="sources">Sources and references</button>'+
  '<button class="btn ghost" data-act="wipe" style="color:var(--alert);border-color:var(--alert)">Delete everything</button></div>'+
  fmCard('settings')+
  '<button class="btn ghost" data-act="modal-close">Close</button>'+
  '<p class="tiny center" style="margin-top:10px">AfterBaby · gentle information and support, not medical advice</p>';
  openModal(h);
  fmLoadPrice();
}

/* ================= wiring ================= */
function wireCommon(){
  var app=document.getElementById('app');
  app.onclick=function(e){
    var t;
    t=e.target.closest('[data-mood]'); if(t){ CI.mood=Number(t.getAttribute('data-mood')); selIn('ci-mood',t); return; }
    t=e.target.closest('[data-energy]'); if(t){ CI.energy=Number(t.getAttribute('data-energy')); selIn('ci-energy',t); return; }
    t=e.target.closest('[data-pain]'); if(t){ CI.pain=Number(t.getAttribute('data-pain')); selIn('ci-pain',t); return; }
    t=e.target.closest('[data-bleed]'); if(t){ CI.bleeding=t.getAttribute('data-bleed'); selIn('ci-bleed',t); return; }
    t=e.target.closest('[data-epq]'); if(t){ EP.answers[EP.idx]=Number(t.getAttribute('data-epq')); EP.idx++; if(EP.idx>=EPDS_Q.length){ finishEpds(); } else { render(); } return; }
    var b=e.target.closest('[data-act]'); if(!b) return;
    act(b.getAttribute('data-act'), b);
  };
}
function selIn(rowId, btn){
  var row=document.getElementById(rowId); if(!row) return;
  var os=row.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].classList.remove('sel');
  btn.classList.add('sel');
}
function grabCI(){
  var sl=document.getElementById('ci-sleep'), nt=document.getElementById('ci-note');
  if(sl) CI.sleep=sl.value; if(nt) CI.note=nt.value;
}
function act(a, btn){
  if(a==='theme'){ var cur=sget('ab.theme')||'auto'; var next=cur==='auto'?'dark':(cur==='dark'?'light':'auto'); sset('ab.theme',next); applyTheme(); snack(next==='auto'?'Appearance: automatic':'Appearance: '+next); return; }
  if(a==='settings'){ settingsModal(); return; }
  if(a==='fm-buy'){ fmBuy(btn,false); return; }
  if(a==='fm-restore'){ fmBuy(btn,true); return; }
  if(a==='fm-later'){ sset('ab.fm_dismissed', String(Date.now())); render(); snack('Okay. It will be here if you ever want it.'); return; }
  if(a==='fm-name'){ var f=fmState()||{}; var nm=(document.getElementById('fm-name')||{value:''}).value.trim().slice(0,40); f.name=nm; fmSet(f); snack(nm?'Saved. Thank you, '+nm+'.':'Saved. You will stay anonymous.'); return; }
  if(a==='redflags'){ redflagsModal(); return; }
  if(a==='sources'){ sourcesModal(); return; }
  if(a==='quiet-open'){ quietOpen(); return; }
  if(a==='quiet-close'){ quietClose(); return; }
  if(a==='quiet-sound'){ Q.sndOn=!Q.sndOn; if(Q.sndOn) quietStartSound(); else quietStopSound(); btn.textContent='Sound: '+(Q.sndOn?'rain':'off'); btn.classList.toggle('on',Q.sndOn); btn.setAttribute('aria-pressed',Q.sndOn); return; }
  if(a==='quiet-breathe'){ Q.lilyOn=!Q.lilyOn; var ql=document.getElementById('qlily'); ql.classList.toggle('on',Q.lilyOn); btn.classList.toggle('on',Q.lilyOn); btn.setAttribute('aria-pressed',Q.lilyOn); document.getElementById('qwords').style.display=Q.lilyOn?'none':''; if(Q.lilyOn){ var pt=ql.querySelector('.qpet'); pt.style.animation='none'; void ql.offsetWidth; pt.style.animation=''; quietCue(); } else clearTimeout(Q.cueT); return; }
  if(a==='quiet-read'){ quietPassage(); document.getElementById('qread').classList.add('on'); document.getElementById('qwords').style.display='none'; return; }
  if(a==='quiet-next'){ quietPassage(); return; }
  if(a==='quiet-readclose'){ document.getElementById('qread').classList.remove('on'); document.getElementById('qwords').style.display=Q.lilyOn?'none':''; return; }
  if(a==='quiet-words'){ Q.wordsOn=!Q.wordsOn; btn.textContent='Words: '+(Q.wordsOn?'on':'off'); btn.setAttribute('aria-pressed',Q.wordsOn); var qw=document.getElementById('qw'); if(!Q.wordsOn){ qw.classList.remove('on'); clearTimeout(Q.wt);} else { Q.wt=setTimeout(Q.showWord,1500);} return; }
  if(a==='journal-save'){ var jt=document.getElementById('jr-text').value.trim(); if(!jt){ snack('The page is still blank. That is allowed too.'); return; } S.journal.push({id:uid(), date:todayKey(), text:jt}); persist(); render(); snack('Kept. Only you can see it.'); return; }
  if(a==='journal-del'){ var jid=btn.getAttribute('data-id'); S.journal=S.journal.filter(function(j){return j.id!==jid;}); persist(); render(); snack('Removed.'); return; }
  if(a==='modal-close'){ closeModal(); return; }
  if(a==='go-today'){ nav('today'); return; }
  if(a==='ci-edit'){ var t=todaysLog(); if(t){ CI={mood:t.mood||0, energy:t.energy||0, pain:(t.pain==null?-1:t.pain), bleeding:t.bleeding||'', sleep:(t.sleep==null?'':t.sleep), note:t.note||''}; S.logs=S.logs.filter(function(l){return l.date!==todayKey();}); persist(); } nav('today'); return; }
  if(a==='ci-save'){
    grabCI();
    if(!CI.mood){ snack('Just choose a mood. The rest is optional.'); return; }
    var entry={id:uid(), date:todayKey(), mood:CI.mood, energy:CI.energy||null, pain:(CI.pain<0?null:CI.pain), bleeding:CI.bleeding||null, sleep:(CI.sleep===''?null:Number(CI.sleep)), note:CI.note||''};
    S.logs.push(entry); persist();
    var heavy = CI.bleeding==='Heavy';
    var rough = CI.mood===1;
    CI={mood:0,energy:0,pain:-1,bleeding:'',sleep:'',note:''};
    render();
    if(heavy){ openModal('<h2>About that heavy bleeding</h2><p style="margin-top:10px;font-weight:300">Heavy bleeding beyond the first week — soaking a pad in an hour, or clots larger than an egg — deserves a call to your provider today. Not to frighten you: most causes are very treatable. You know your body; let them check.</p><div class="spacer"></div><a href="tel:911" class="btn alert">Soaking a pad an hour? Call 911</a><button class="btn ghost" data-act="modal-close">Noted — I will call my provider</button>'); }
    else if(rough){ snack('Saved. Rough days are allowed. The Mind page is there if you want company.'); }
    else { snack('Saved. Thirty seconds, and it matters.', function(){ S.logs=S.logs.filter(function(l){return l.id!==entry.id;}); persist(); render(); }); }
    return;
  }
  if(a==='concern-add'){ var inp=document.getElementById('concern-in'); var v=inp.value.trim(); if(!v){ snack('Write a note first.'); return; }
    var c={id:uid(), date:todayKey(), text:v}; S.concerns.push(c); persist(); render();
    snack('Added to your visit brief.', function(){ S.concerns=S.concerns.filter(function(x){return x.id!==c.id;}); persist(); render(); }); return; }
  if(a==='epds-start'){ EP={active:true, idx:0, answers:[]}; render(); return; }
  if(a==='epds-cancel'){ EP.active=false; render(); return; }
  if(a==='brief-print'){ window.print(); return; }
  if(a==='brief-copy'){
    var txt=briefText();
    var done=function(ok){ snack(ok?'Copied. Paste it anywhere.':'This browser would not allow copying.'); };
    if(navigator.clipboard && navigator.clipboard.writeText){ navigator.clipboard.writeText(txt).then(function(){done(true);},function(){done(false);}); }
    else { done(false); }
    return;
  }
  if(a==='village-join'){ var z=document.getElementById('vg-zip').value.trim(); if(!z){ snack('Add your ZIP so we know where to open first.'); return; } S.village={zip:z, date:todayKey()}; persist(); render(); snack('You are on the list. Your village is coming.'); return; }
  if(a==='set-save'){ var n=document.getElementById('set-name').value.trim(); var d=document.getElementById('set-date').value; if(n) S.profile.name=n; if(d) S.profile.birthDate=d; persist(); closeModal(); render(); snack('Saved.'); return; }
  if(a==='export'){
    var data=JSON.stringify({profile:S.profile, logs:S.logs, epds:S.epds, concerns:S.concerns, journal:S.journal, exported:new Date().toISOString()}, null, 2);
    var blob=new Blob([data],{type:'application/json'}); var url=URL.createObjectURL(blob);
    var aa=document.createElement('a'); aa.href=url; aa.download='afterbaby-data-'+todayKey()+'.json'; document.body.appendChild(aa); aa.click(); document.body.removeChild(aa);
    setTimeout(function(){URL.revokeObjectURL(url);},2000); snack('Your data, downloaded. It is yours.'); return;
  }
  if(a==='wipe'){
    openModal('<h2>Delete everything?</h2><p class="sub" style="margin-top:8px">This erases your profile and every entry from this device. There is no cloud copy; this is permanent.</p><div class="spacer"></div><button class="btn alert" data-act="wipe-yes">Yes, delete it all</button><button class="btn ghost" data-act="modal-close">Keep my data</button>');
    return;
  }
  if(a==='wipe-yes'){ sdel('ab.profile');sdel('ab.logs');sdel('ab.epds');sdel('ab.concerns');sdel('ab.village');sdel('ab.journal'); S={profile:null,logs:[],epds:[],concerns:[],village:null,journal:[],view:'today',lastDeleted:null}; OB={step:0,name:'',birthDate:'',birthType:'',feeding:''}; closeModal(); render(); return; }
}
document.getElementById('modalroot').addEventListener('click',function(e){
  var t=e.target.closest('[data-theme-v]');
  if(t){ sset('ab.theme', t.getAttribute('data-theme-v')); applyTheme();
    var row=document.getElementById('themerow'); var os=row.querySelectorAll('.opt'); for(var i=0;i<os.length;i++) os[i].classList.remove('sel'); t.classList.add('sel'); return; }
  var b=e.target.closest('[data-act]'); if(b) act(b.getAttribute('data-act'), b);
});
document.getElementById('quietroot').addEventListener('click',function(e){
  var b=e.target.closest('[data-act]'); if(b) act(b.getAttribute('data-act'), b);
});
document.addEventListener('input',function(e){ if(e.target.id==='ci-sleep') CI.sleep=e.target.value; if(e.target.id==='ci-note') CI.note=e.target.value; });

render();
</script>
</body>
</html>
